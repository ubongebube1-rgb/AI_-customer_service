services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=3000
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             flask run --debug"
    restart: unless-stopped
